name: Release Metagraf

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

jobs:
  orchestrate:
    name: Orchestrate release
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    environment: Release
    outputs:
      artifact-name: ${{ steps.handoff.outputs.artifact-name }}
    env:
      GH_TOKEN: ${{ github.token }}
      CURSOR_API_KEY: ${{ secrets.CURSOR_API_KEY }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      XCODE_CLOUD_WORKFLOW_ID: ${{ secrets.XCODE_CLOUD_WORKFLOW_ID || vars.XCODE_CLOUD_WORKFLOW_ID }}
      XCODE_CLOUD_PRODUCT_ID: ${{ secrets.XCODE_CLOUD_PRODUCT_ID || vars.XCODE_CLOUD_PRODUCT_ID }}
      APP_STORE_CONNECT_APP_ID: ${{ secrets.APP_STORE_CONNECT_APP_ID || vars.APP_STORE_CONNECT_APP_ID }}
      REPOSITORY_IDENTITY: ${{ secrets.REPOSITORY_IDENTITY || vars.REPOSITORY_IDENTITY }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up cached Python dependencies
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: Scripts/release/requirements.txt

      - name: Install release Python dependencies
        run: python3 -m pip install --disable-pip-version-check -r Scripts/release/requirements.txt

      - name: Validate tag and source
        id: version
        run: |
          set -euo pipefail
          [[ "$REPOSITORY_IDENTITY" == "$GITHUB_REPOSITORY" ]] || {
            echo "error: REPOSITORY_IDENTITY does not match this repository" >&2
            exit 1
          }
          git fetch origin main
          python3 Scripts/release/release_tools.py validate-ancestry "$GITHUB_SHA" origin/main
          metadata="$(python3 Scripts/release/release_tools.py validate-tag "$GITHUB_REF_NAME")"
          echo "version=$(jq -r .version <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "channel=$(jq -r .channel <<<"$metadata")" >> "$GITHUB_OUTPUT"
          echo "prerelease=$(jq -r .prerelease <<<"$metadata")" >> "$GITHUB_OUTPUT"

      - name: Generate German release notes
        run: |
          : "${CURSOR_API_KEY:?Configure CURSOR_API_KEY}"
          python3 Scripts/release/release_tools.py generate-notes \
            --tag "$GITHUB_REF_NAME" \
            --output "$RUNNER_TEMP/release-notes.md"
          echo "----- release notes -----"
          cat "$RUNNER_TEMP/release-notes.md"
          echo "----- end release notes -----"

      - name: Create or reuse draft release
        id: release
        env:
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail
          existing="$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            --jq "map(select(.tag_name == \"$GITHUB_REF_NAME\")) | first // empty")"
          if [[ -n "$existing" ]]; then
            [[ "$(jq -r .draft <<<"$existing")" == "true" ]] || {
              echo "error: $GITHUB_REF_NAME is already published" >&2
              exit 1
            }
            release_id="$(jq -r .id <<<"$existing")"
            gh release edit "$GITHUB_REF_NAME" --title "Metagraf $VERSION" \
              --notes-file "$RUNNER_TEMP/release-notes.md"
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$release_id" \
              -F prerelease="$PRERELEASE" >/dev/null
          else
            created="$(
              jq -n \
                --arg tag "$GITHUB_REF_NAME" \
                --arg name "Metagraf $VERSION" \
                --rawfile body "$RUNNER_TEMP/release-notes.md" \
                --argjson prerelease "$PRERELEASE" \
                '{tag_name:$tag,name:$name,body:$body,draft:true,prerelease:$prerelease}' |
                gh api --method POST "repos/$GITHUB_REPOSITORY/releases" --input -
            )"
            release_id="$(jq -r '.id // empty' <<<"$created")"
          fi
          [[ -n "$release_id" ]] || { echo "error: draft release was not found" >&2; exit 1; }
          echo "id=$release_id" >> "$GITHUB_OUTPUT"

      - name: Wait for notarized Xcode Cloud artifact
        env:
          RELEASE_ID: ${{ steps.release.outputs.id }}
          VERSION: ${{ steps.version.outputs.version }}
          CHANNEL: ${{ steps.version.outputs.channel }}
        run: |
          : "${XCODE_CLOUD_WORKFLOW_ID:?Configure XCODE_CLOUD_WORKFLOW_ID}"
          : "${XCODE_CLOUD_PRODUCT_ID:?Configure XCODE_CLOUD_PRODUCT_ID}"
          : "${APP_STORE_CONNECT_APP_ID:?Configure APP_STORE_CONNECT_APP_ID}"
          python3 Scripts/release/app_store_connect.py \
            --workflow-id "$XCODE_CLOUD_WORKFLOW_ID" \
            --product-id "$XCODE_CLOUD_PRODUCT_ID" \
            --app-id "$APP_STORE_CONNECT_APP_ID" \
            --tag "$GITHUB_REF_NAME" \
            --commit "$GITHUB_SHA" \
            --release-id "$RELEASE_ID" \
            --version "$VERSION" \
            --channel "$CHANNEL" \
            --output-directory "$RUNNER_TEMP/xcode-cloud"

      - name: Upload notarized handoff
        id: handoff
        uses: actions/upload-artifact@v7
        with:
          name: xcode-cloud-notarized-${{ github.ref_name }}
          path: ${{ runner.temp }}/xcode-cloud
          if-no-files-found: error
          retention-days: 2
          overwrite: true

  sparkle:
    name: Prepare Sparkle update
    needs: orchestrate
    runs-on: xcode-27
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
      SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
      APPCAST_URL: ${{ secrets.APPCAST_URL || vars.APPCAST_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: xcode-cloud-notarized-${{ github.ref_name }}
          path: ${{ runner.temp }}/xcode-cloud

      - name: Restore Swift package cache
        uses: actions/cache@v5
        with:
          path: |
            ${{ runner.temp }}/sparkle-release/SourcePackages
            ~/Library/Caches/org.swift.swiftpm
          key: sparkle-spm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Metagraf.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            sparkle-spm-${{ runner.os }}-${{ runner.arch }}-

      - name: Verify, package, and sign update
        run: |
          Scripts/release/prepare_sparkle_release.sh \
            "$RUNNER_TEMP/xcode-cloud" "$RUNNER_TEMP/sparkle-output"

      - name: Upload Sparkle handoff
        uses: actions/upload-artifact@v7
        with:
          name: sparkle-release-${{ github.ref_name }}
          path: ${{ runner.temp }}/sparkle-output
          if-no-files-found: error
          retention-days: 2
          overwrite: true

  publish:
    name: Publish artifacts and appcast
    needs: sparkle
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APPCAST_URL: ${{ secrets.APPCAST_URL || vars.APPCAST_URL }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v7
        with:
          name: sparkle-release-${{ github.ref_name }}
          path: ${{ runner.temp }}/sparkle-output

      - name: Validate handoff
        id: manifest
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sparkle-output"
          [[ "$(jq -r .tag manifest.json)" == "$GITHUB_REF_NAME" ]]
          [[ "$(jq -r .commit manifest.json)" == "$GITHUB_SHA" ]]
          release_id="$(jq -r .releaseId manifest.json)"
          actual_release="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id")"
          [[ "$(jq -r .tag_name <<<"$actual_release")" == "$GITHUB_REF_NAME" ]]
          echo "release-draft=$(jq -r .draft <<<"$actual_release")" >> "$GITHUB_OUTPUT"
          zip_file="$(jq -r .zipFile manifest.json)"
          checksum_file="$(jq -r .checksumFile manifest.json)"
          mapfile -t delta_files < <(jq -r '.deltaFiles[]?' manifest.json)
          [[ -f "$zip_file" && -f "$checksum_file" && -f appcast.xml ]]
          for delta_file in "${delta_files[@]}"; do
            [[ -f "$delta_file" ]]
          done
          sha256sum --check "$checksum_file"
          appcast_sha="$(sha256sum appcast.xml | awk '{print $1}')"
          [[ "$appcast_sha" == "$(jq -r .appcastSha256 manifest.json)" ]]
          expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$zip_file"
          grep -Fq "$expected_url" appcast.xml
          for delta_file in "${delta_files[@]}"; do
            expected_delta_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$delta_file"
            grep -Fq "$expected_delta_url" appcast.xml
          done
          echo "release-id=$release_id" >> "$GITHUB_OUTPUT"
          echo "zip=$zip_file" >> "$GITHUB_OUTPUT"
          echo "checksum=$checksum_file" >> "$GITHUB_OUTPUT"

      - name: Upload release assets
        env:
          ZIP_FILE: ${{ steps.manifest.outputs.zip }}
          CHECKSUM_FILE: ${{ steps.manifest.outputs.checksum }}
          RELEASE_DRAFT: ${{ steps.manifest.outputs.release-draft }}
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/sparkle-output"
          mapfile -t delta_files < <(jq -r '.deltaFiles[]?' manifest.json)
          release_assets=("$ZIP_FILE" "$CHECKSUM_FILE" appcast.xml "${delta_files[@]}")
          if [[ "$RELEASE_DRAFT" == "true" ]]; then
            gh release upload "$GITHUB_REF_NAME" "${release_assets[@]}" --clobber
          else
            mkdir -p "$RUNNER_TEMP/published-assets"
            download_patterns=(--pattern "$ZIP_FILE" --pattern "$CHECKSUM_FILE" --pattern appcast.xml)
            for delta_file in "${delta_files[@]}"; do
              download_patterns+=(--pattern "$delta_file")
            done
            gh release download "$GITHUB_REF_NAME" --dir "$RUNNER_TEMP/published-assets" "${download_patterns[@]}"
            for asset in "${release_assets[@]}"; do
              cmp --silent "$asset" "$RUNNER_TEMP/published-assets/$asset"
            done
          fi
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          for asset in "${release_assets[@]}"; do
            grep -Fxq "$asset" <<<"$assets"
          done

      - name: Publish GitHub Release
        env:
          RELEASE_ID: ${{ steps.manifest.outputs.release-id }}
        run: |
          prerelease="$(jq -r .channel "$RUNNER_TEMP/sparkle-output/manifest.json")"
          [[ "$prerelease" == "beta" ]] && prerelease=true || prerelease=false
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
            -F draft=false -F prerelease="$prerelease" >/dev/null

      - name: Verify published asset URL
        env:
          ZIP_FILE: ${{ steps.manifest.outputs.zip }}
        run: |
          expected_url="https://github.com/$GITHUB_REPOSITORY/releases/download/$GITHUB_REF_NAME/$ZIP_FILE"
          actual_url="$(gh release view "$GITHUB_REF_NAME" --json assets \
            --jq ".assets[] | select(.name == \"$ZIP_FILE\") | .url")"
          [[ "$actual_url" == "$expected_url" ]]

      - name: Prepare Pages artifact
        run: |
          mkdir -p "$RUNNER_TEMP/pages"
          cp "$RUNNER_TEMP/sparkle-output/appcast.xml" "$RUNNER_TEMP/pages/appcast.xml"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ runner.temp }}/pages
      - name: Deploy appcast
        id: pages
        uses: actions/deploy-pages@v5

      - name: Verify public appcast
        env:
          EXPECTED: ${{ runner.temp }}/sparkle-output/appcast.xml
        run: |
          set -euo pipefail
          : "${APPCAST_URL:?Configure the APPCAST_URL repository variable}"
          for attempt in {1..12}; do
            if curl --fail --silent --show-error \
              "$APPCAST_URL" \
              --output "$RUNNER_TEMP/public-appcast.xml"; then
              if cmp --silent "$EXPECTED" "$RUNNER_TEMP/public-appcast.xml"; then
                exit 0
              fi
            fi
            sleep 10
          done
          echo "error: deployed appcast did not match the signed artifact" >&2
          exit 1
